PLG_SYSTEM_CLEARSTATS="System - ClearStats"
PLG_SYSTEM_CLEARSTATS_XML_DESCRIPTION="Adds the ClearStats cookieless tracking snippet to every frontend page. No cookies, no browser storage, no raw IP/User-Agent storage — see clearstats.online for the full privacy model."

PLG_SYSTEM_CLEARSTATS_FIELD_INTRO_LABEL="Setup"
PLG_SYSTEM_CLEARSTATS_FIELD_INTRO_DESC="Create the site in your ClearStats installation first (Sites → Add site), then copy its Site ID here. Enable the optional tracking below only if you actually want it — nothing extra is collected by default."

PLG_SYSTEM_CLEARSTATS_FIELD_SCRIPT_DOMAIN_LABEL="ClearStats installation URL"
PLG_SYSTEM_CLEARSTATS_FIELD_SCRIPT_DOMAIN_DESC="The base URL of your self-hosted ClearStats installation, e.g. https://analytics.example.com — the plugin loads {URL}/js/track.js."

PLG_SYSTEM_CLEARSTATS_FIELD_SITE_ID_LABEL="Site ID"
PLG_SYSTEM_CLEARSTATS_FIELD_SITE_ID_DESC="The Site ID shown on this site's Install page in the ClearStats dashboard."

PLG_SYSTEM_CLEARSTATS_FIELD_OUTBOUND_LABEL="Track outbound link clicks"
PLG_SYSTEM_CLEARSTATS_FIELD_OUTBOUND_DESC="Fires an event when a visitor clicks a link to a different domain."

PLG_SYSTEM_CLEARSTATS_FIELD_DOWNLOADS_LABEL="Track file download clicks"
PLG_SYSTEM_CLEARSTATS_FIELD_DOWNLOADS_DESC="Fires an event when a visitor clicks a link to a common downloadable file type (PDF, ZIP, DOCX, etc.)."

PLG_SYSTEM_CLEARSTATS_FIELD_404_LABEL="Track 404 pages"
PLG_SYSTEM_CLEARSTATS_FIELD_404_DESC="Attempts to detect Joomla's error page and tag it as a 404 event. Detection depends on your Joomla version/configuration — verify it actually fires (see the plugin's README) before relying on it."
